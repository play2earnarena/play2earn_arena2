<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Play2Earn Arena</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111a2e;
  --accent:#00ffd5;
  --text:#e6e9f0;
}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{
  margin:0;
  background:linear-gradient(180deg,#050b18,#0b1220);
  color:var(--text);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:#070e1c;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{font-size:18px;margin:0}
nav button{
  background:none;
  border:1px solid #233;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  margin-left:6px;
}
.container{max-width:1000px;margin:auto;padding:16px}
.hero{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
  margin-top:20px;
}
.card{
  background:var(--card);
  border-radius:14px;
  padding:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.center{text-align:center}
.circle{
  width:160px;
  height:160px;
  border-radius:50%;
  background:var(--accent);
  margin:20px auto;
  box-shadow:0 0 40px var(--accent);
  cursor:pointer;
}
.stats h2{margin:6px 0}
.progress{
  height:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}
.progress div{
  height:100%;
  background:var(--accent);
  width:0%;
}
.ad{
  background:#0e1a33;
  border:1px dashed #2a3c66;
  padding:20px;
  border-radius:10px;
  text-align:center;
  opacity:.7;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}
.modal.active{display:flex}
.modal-box{
  background:#0f1b34;
  width:90%;
  max-width:360px;
  padding:20px;
  border-radius:14px;
}
.modal-box h3{text-align:center;margin-top:0}
.modal-box input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:6px;
  border:none;
}
.modal-box button{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:6px;
  border:none;
  font-weight:bold;
}
.primary{background:var(--accent)}
.secondary{background:#222;color:#fff}
footer{
  text-align:center;
  opacity:.5;
  padding:20px;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>🎮 Play2Earn Arena</h1>
  <nav>
    <button onclick="openLogin()">Login</button>
    <button onclick="openRegister()">Register</button>
    <button onclick="logout()">Logout</button>
  </nav>
</header>

<div class="container">
  <div class="hero">
    <div class="card center">
      <h2 id="userEmail">Guest</h2>
      <div class="stats">
        <h2>Points: <span id="points">0</span></h2>
        <p>Target: <span id="target">2,000,000</span></p>
        <div class="progress">
          <div id="progressBar"></div>
        </div>
      </div>
      <div class="circle" onclick="earnPoint()"></div>
      <p>Tap to earn points</p>
    </div>

    <div class="card ad">
      🔥 Ad Space (AdSense / Media.net Ready)
    </div>
  </div>
</div>

<footer>
  © 2025 Play2Earn Arena • Business Platform
</footer>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>
    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button class="primary" onclick="login()">Login</button>
    <button class="secondary" onclick="closeModals()">Close</button>
  </div>
</div>

<!-- REGISTER MODAL -->
<div class="modal" id="registerModal">
  <div class="modal-box">
    <h3>Register</h3>
    <input id="regEmail" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button class="primary" onclick="register()">Create Account</button>
    <button class="secondary" onclick="closeModals()">Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-YhBz-AkexkNZ8OqIJzEeMN8AhZYqVG0",
  authDomain: "play2earn-arena-cab9d.firebaseapp.com",
  projectId: "play2earn-arena-cab9d",
  storageBucket: "play2earn-arena-cab9d.firebasestorage.app",
  messagingSenderId: "309303655208",
  appId: "1:309303655208:web:0e153671ea2591d655ae1d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let points = 0;

const tiers = [
  {name:"Bronze", target:2000000},
  {name:"Silver", target:4000000},
  {name:"Gold", target:6000000}
];

function updateUI(){
  document.getElementById("points").innerText = points.toLocaleString();
  let tier = tiers.find(t => points < t.target) || tiers[2];
  document.getElementById("target").innerText = tier.target.toLocaleString();
  let pct = Math.min((points / tier.target) * 100, 100);
  document.getElementById("progressBar").style.width = pct + "%";
}

window.earnPoint = async ()=>{
  if(!currentUser) return alert("Login required");
  points += 1;
  updateUI();
  await updateDoc(doc(db,"users",currentUser.uid),{points});
};

window.register = async ()=>{
  const email = regEmail.value;
  const pass = regPassword.value;
  const res = await createUserWithEmailAndPassword(auth,email,pass);
  await setDoc(doc(db,"users",res.user.uid),{points:0});
  closeModals();
};

window.login = async ()=>{
  const email = loginEmail.value;
  const pass = loginPassword.value;
  await signInWithEmailAndPassword(auth,email,pass);
  closeModals();
};

window.logout = ()=>signOut(auth);

onAuthStateChanged(auth, async user=>{
  if(user){
    currentUser = user;
    userEmail.innerText = user.email;
    const snap = await getDoc(doc(db,"users",user.uid));
    points = snap.exists()? snap.data().points : 0;
    updateUI();
  }else{
    currentUser=null;
    userEmail.innerText="Guest";
    points=0;
    updateUI();
  }
});

window.openLogin=()=>{loginModal.classList.add("active")}
window.openRegister=()=>{registerModal.classList.add("active")}
window.closeModals=()=>{
  loginModal.classList.remove("active");
  registerModal.classList.remove("active");
};
</script>

</body>
      </html>
