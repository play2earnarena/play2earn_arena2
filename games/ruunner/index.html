<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Runner Game</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}
canvas {
  background: #222;
  display: block;
  margin: 20px auto;
}
</style>
</head>
<body>

<h2>Runner Game</h2>
<p>Tap / Click to jump</p>

<canvas id="game" width="300" height="150"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let y = 100;
let velocity = 0;
let gravity = 1;
let jumping = false;

function jump() {
  if (!jumping) {
    velocity = -15;
    jumping = true;
  }
}

canvas.addEventListener("click", jump);
document.body.addEventListener("touchstart", jump);

function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  velocity += gravity;
  y += velocity;

  if (y > 100) {
    y = 100;
    velocity = 0;
    jumping = false;
  }

  ctx.fillStyle = "lime";
  ctx.fillRect(50, y, 20, 20);

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
