<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Play2Earn Runner</title>

<style>
  body {
    margin: 0;
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  h2 {
    margin-top: 15px;
  }

  #score {
    margin-bottom: 10px;
    font-size: 18px;
  }

  #game {
    position: relative;
    width: 300px;
    height: 200px;
    margin: 0 auto;
    background: linear-gradient(#101a3a, #050812);
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid #00ffd5;
  }

  #player {
    position: absolute;
    bottom: 10px;
    left: 30px;
    width: 30px;
    height: 30px;
    background: #00ffd5;
    border-radius: 5px;
  }

  .obstacle {
    position: absolute;
    bottom: 10px;
    width: 25px;
    height: 25px;
    background: #ff4d4d;
    right: -30px;
    border-radius: 4px;
  }

  #jumpBtn {
    margin-top: 20px;
    padding: 15px 40px;
    font-size: 18px;
    background: #00ffd5;
    border: none;
    border-radius: 8px;
    color: black;
  }
</style>
</head>

<body>

<h2>🏃 Play2Earn Runner</h2>
<div id="score">Score: 0</div>

<div id="game">
  <div id="player"></div>
</div>

<button id="jumpBtn">JUMP</button>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-YhBz-AkexkNZ8OqIJzEeMN8AhZYqVG0",
  authDomain: "play2earn-arena-cab9d.firebaseapp.com",
  projectId: "play2earn-arena-cab9d",
  storageBucket: "play2earn-arena-cab9d.appspot.com",
  messagingSenderId: "309303655208",
  appId: "1:309303655208:web:0e153671ea2591d655ae1d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.saveScoreToFirebase = async function(score) {
  const user = auth.currentUser;
  if (!user) return;

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref, { points: score });
  } else {
    await updateDoc(ref, { points: increment(score) });
  }
};
</script>

<script>
const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreText = document.getElementById("score");

let jumping = false;
let gravity = 0;
let score = 0;
let gameRunning = true;

function jump() {
  if (jumping) return;
  jumping = true;
  gravity = 12;
}

document.getElementById("jumpBtn").addEventListener("click", jump);
document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});

function createObstacle() {
  if (!gameRunning) return;

  const obs = document.createElement("div");
  obs.className = "obstacle";
  game.appendChild(obs);

  let x = 300;

  const move = setInterval(() => {
    if (!gameRunning) {
      clearInterval(move);
      obs.remove();
      return;
    }

    x -= 4;
    obs.style.right = x + "px";

    // Collision
    const pRect = player.getBoundingClientRect();
    const oRect = obs.getBoundingClientRect();

    if (
      pRect.left < oRect.right &&
      pRect.right > oRect.left &&
      pRect.bottom > oRect.top
    ) {
      gameOver();
      clearInterval(move);
    }

    if (x > 330) {
      clearInterval(move);
      obs.remove();
    }
  }, 20);
}

function gameLoop() {
  if (!gameRunning) return;

  // Jump physics
  if (jumping) {
    let bottom = parseInt(getComputedStyle(player).bottom);
    bottom += gravity;
    gravity -= 1;

    if (bottom <= 10) {
      bottom = 10;
      jumping = false;
    }
    player.style.bottom = bottom + "px";
  }

  score++;
  scoreText.innerText = "Score: " + score;

  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  saveScoreToFirebase(score);
  alert("Game Over! Score: " + score);
  location.reload();
}

setInterval(createObstacle, 1800);
gameLoop();
</script>

</body>
</html>
