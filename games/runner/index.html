<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play2Earn Runner</title>

<style>
/* =======================
   GLOBAL STYLES
======================= */
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #0f1b3d, #050814);
  color: #ffffff;
  font-family: "Segoe UI", system-ui, sans-serif;
  display: flex;
  justify-content: center;
}

/* =======================
   APP CONTAINER
======================= */
.app {
  width: 100%;
  max-width: 420px;
  padding: 16px;
}

/* =======================
   HEADER
======================= */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.title {
  font-size: 22px;
  font-weight: 700;
}

.points {
  font-size: 14px;
  opacity: 0.85;
}

/* =======================
   GAME CARD
======================= */
.game-card {
  background: linear-gradient(180deg, #0f1f4a, #080c1d);
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

/* =======================
   SCORE
======================= */
.score {
  text-align: center;
  font-size: 18px;
  margin-bottom: 10px;
}

/* =======================
   GAME AREA
======================= */
.game-area {
  position: relative;
  height: 220px;
  background: linear-gradient(180deg, #0a1330, #050814);
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid #00ffd5;
}

/* =======================
   PLAYER
======================= */
.player {
  position: absolute;
  bottom: 14px;
  left: 40px;
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, #00ffd5, #00bfa6);
  border-radius: 6px;
  box-shadow: 0 0 12px rgba(0,255,213,0.8);
}

/* =======================
   OBSTACLE
======================= */
.obstacle {
  position: absolute;
  bottom: 14px;
  width: 26px;
  height: 26px;
  background: linear-gradient(135deg, #ff4d4d, #c62828);
  border-radius: 5px;
}

/* =======================
   CONTROLS
======================= */
.controls {
  display: flex;
  justify-content: center;
  margin-top: 16px;
}

.jump-btn {
  width: 160px;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #00ffd5, #00bfa6);
  color: #001d18;
  box-shadow: 0 10px 30px rgba(0,255,213,0.4);
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="title">🏃 Play2Earn Runner</div>
    <div class="points">Session</div>
  </div>

  <!-- GAME -->
  <div class="game-card">
    <div class="score" id="score">Score: 0</div>

    <div class="game-area" id="game">
      <div class="player" id="player"></div>
    </div>

    <div class="controls">
      <button class="jump-btn" id="jumpBtn">JUMP</button>
    </div>
  </div>

</div>

<script>
/* =======================
   GAME STATE
======================= */
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreEl = document.getElementById("score");
const jumpBtn = document.getElementById("jumpBtn");

let score = 0;
let velocity = 0;
let jumping = false;
let running = true;

/* =======================
   PHYSICS CONSTANTS
======================= */
const GRAVITY = -0.6;
const JUMP_FORCE = 11;
const GROUND = 14;

/* =======================
   JUMP
======================= */
function jump() {
  if (jumping) return;
  velocity = JUMP_FORCE;
  jumping = true;
}

jumpBtn.addEventListener("click", jump);
document.addEventListener("keydown", e => {
  if (e.code === "Space") jump();
});

/* =======================
   CREATE OBSTACLE
======================= */
function spawnObstacle() {
  if (!running) return;

  const obs = document.createElement("div");
  obs.className = "obstacle";
  game.appendChild(obs);

  let x = game.offsetWidth;

  const move = setInterval(() => {
    if (!running) {
      clearInterval(move);
      obs.remove();
      return;
    }

    x -= 4;
    obs.style.left = x + "px";

    const p = player.getBoundingClientRect();
    const o = obs.getBoundingClientRect();

    if (
      p.left < o.right &&
      p.right > o.left &&
      p.bottom > o.top
    ) {
      endGame();
      clearInterval(move);
    }

    if (x < -30) {
      clearInterval(move);
      obs.remove();
    }
  }, 20);
}

/* =======================
   GAME LOOP
======================= */
function loop() {
  if (!running) return;

  // Player physics
  let bottom = parseFloat(player.style.bottom || GROUND);
  bottom += velocity;
  velocity += GRAVITY;

  if (bottom <= GROUND) {
    bottom = GROUND;
    jumping = false;
  }

  player.style.bottom = bottom + "px";

  score++;
  scoreEl.textContent = "Score: " + score;

  requestAnimationFrame(loop);
}

/* =======================
   GAME OVER
======================= */
function endGame() {
  running = false;

  // Save score locally (safe & reliable)
  const total = Number(localStorage.getItem("play2earn_points") || 0);
  localStorage.setItem("play2earn_points", total + score);

  setTimeout(() => {
    alert("Game Over\nScore: " + score);
    location.reload();
  }, 100);
}

/* =======================
   START GAME
======================= */
setInterval(spawnObstacle, 1600);
loop();
</script>

</body>
</html>
